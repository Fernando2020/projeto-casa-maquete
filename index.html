<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquete de estudo · Casa no aclive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E8E6; --panel:#F7F8F6; --ink:#1E2A2E; --muted:#5E6B6F; --line:#CBD2CF;
  --accent:#3F6E58; --accent-ink:#FFFFFF; --sun:#C98A2E; --label-bg:rgba(247,248,246,.92);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B2225; --panel:#232C30; --ink:#E6ECEA; --muted:#A3B0AE; --line:#3A464A;
    --accent:#7FB497; --accent-ink:#11201A; --sun:#E3A84A; --label-bg:rgba(35,44,48,.92);
  }
}
:root[data-theme="dark"]{
  --bg:#1B2225; --panel:#232C30; --ink:#E6ECEA; --muted:#A3B0AE; --line:#3A464A;
  --accent:#7FB497; --accent-ink:#11201A; --sun:#E3A84A; --label-bg:rgba(35,44,48,.92);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:relative;width:100%;height:100%}
#scene{position:absolute;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);background:var(--label-bg);color:var(--ink);font-size:12px;font-weight:500;padding:3px 7px;border-radius:6px;white-space:nowrap;border:1px solid var(--line)}
.panel{position:absolute;top:16px;left:16px;width:300px;max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;box-shadow:0 6px 24px rgba(20,30,30,.12)}
h1{font-size:19px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.grp{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.grp h2{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--ink)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button.v{font:inherit;font-size:13px;padding:8px 6px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.v:hover{border-color:var(--accent)}
button.v[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;cursor:pointer}
label.chk input{accent-color:var(--accent);width:16px;height:16px}
select{font:inherit;font-size:13px;width:100%;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin:10px 0 4px}
.row b{font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--sun)}
.readout{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
.hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.45}
#compass{position:absolute;right:18px;top:18px;width:64px;height:64px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
#needle{width:64px;height:64px;transition:none}
#toggle{display:none}
#err{position:absolute;inset:0;display:none;place-items:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:720px){
  .panel{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:55%;padding:14px}
  .panel.closed .body{display:none}
  #toggle{display:block;font:inherit;font-size:13px;font-weight:600;background:transparent;border:0;color:var(--accent);padding:0;cursor:pointer;float:right}
  #compass{width:52px;height:52px;right:12px;top:12px}
  #needle{width:52px;height:52px}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }
</style>
</head>
<body>
<div id="app">
  <div id="scene" role="img" aria-label="Maquete 3D interativa da casa no lote em aclive"></div>
  <div id="labels" aria-hidden="true"></div>
  <div id="compass" title="Norte"><svg id="needle" viewBox="0 0 64 64" aria-label="Indicador do norte"><g id="needleRot"><path d="M32 10 L39 34 L32 30 L25 34 Z" fill="#C98A2E"/><text x="32" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" font-family="Archivo, sans-serif">N</text></g></svg></div>
  <aside class="panel" id="panel">
    <button id="toggle" aria-expanded="true">Ocultar</button>
    <h1>Maquete de estudo</h1>
    <p class="sub" id="sub">Lote 12 × 25 m em aclive</p>
    <div class="body">
      <div class="grp" style="border-top:0;margin-top:0;padding-top:0">
        <h2>Vista</h2>
        <div class="views" role="group" aria-label="Vistas">
          <button class="v" data-view="persp" aria-pressed="true">Perspectiva</button>
          <button class="v" data-view="top" aria-pressed="false">De cima</button>
          <button class="v" data-view="street" aria-pressed="false">Da rua</button>
          <button class="v" data-view="yard" aria-pressed="false">Do quintal</button>
        </div>
      </div>
      <div class="grp">
        <h2>Mostrar</h2>
        <label class="chk"><input type="checkbox" id="cRoof" checked> Telhado</label>
        <label class="chk"><input type="checkbox" id="cFurn" checked> Mobiliário</label>
        <label class="chk"><input type="checkbox" id="cWalls" checked> Muros laterais</label>
        <label class="chk"><input type="checkbox" id="cLabels" checked> Nomes dos ambientes</label>
      </div>
      <div class="grp">
        <h2>Sol</h2>
        <select id="season" aria-label="Época do ano">
          <option value="-23.44">Verão (dezembro)</option>
          <option value="0" selected>Outono e primavera (março, setembro)</option>
          <option value="23.44">Inverno (junho)</option>
        </select>
        <div class="row"><span>Hora</span><b id="hourOut">15:00</b></div>
        <input type="range" id="hour" min="6" max="18" step="0.25" value="15" aria-label="Hora do dia">
        <div class="readout" id="sunOut"></div>
      </div>
      <p class="hint">Arraste para girar, use dois dedos ou a roda do mouse para aproximar. Sem o telhado, a planta aparece por dentro.</p>
    </div>
  </aside>
  <div id="err">Não foi possível carregar a maquete 3D neste navegador.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="geometria.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='grid';return;}
const container=document.getElementById('scene');
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true});
}catch(e){document.getElementById('err').style.display='grid';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,400);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.maxPolarAngle=Math.PI*0.495;controls.minDistance=6;controls.maxDistance=120;

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function applyBg(){scene.background=new THREE.Color(cssVar('--bg')||'#E4E8E6');}
applyBg();
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyBg);}catch(e){}

// lights
const hemi=new THREE.HemisphereLight(0xffffff,0x8a8a80,0.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff3df,1.0);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-24;sc.right=24;sc.top=24;sc.bottom=-24;sc.near=1;sc.far=140;
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.02;
scene.add(sun);scene.add(sun.target);

// materials (cores em modelo/casa.json; transparências são escolha da maquete)
if(!window.CASA){document.getElementById('err').textContent='Faltou o arquivo geometria.js ao lado da maquete. Rode python scripts/gerar_tudo.py.';document.getElementById('err').style.display='grid';return;}
const ALPHA={glass:0.38,cover:0.42,muro:0.55};
function M(c,o){const p={color:c,roughness:0.92,metalness:0};if(o!==undefined){p.transparent=true;p.opacity=o;p.depthWrite=o>0.6;}return new THREE.MeshStandardMaterial(p);}
const mat={};Object.keys(CASA.materiais).forEach(k=>{mat[k]=M(CASA.materiais[k],ALPHA[k]);});
mat.roof.flatShading=true;

document.getElementById('sub').textContent='Lote 12 × 25 m em aclive, versão '+CASA.versao;

// plan coords: x across lot (0 = NW side), y depth from street (0 = street). world X=x-6, Z=12.5-y
const groups={};
['ground','terreo','house','furn','roof','muros','stair'].forEach(k=>{groups[k]=new THREE.Group();scene.add(groups[k]);});
function box(g,x1,x2,y1,y2,h0,h1,m){
  const w=Math.abs(x2-x1),d=Math.abs(y2-y1),h=Math.abs(h1-h0);
  if(w<=0||d<=0||h<=0)return null;
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  mesh.position.set((x1+x2)/2-6,(h0+h1)/2,12.5-(y1+y2)/2);
  mesh.castShadow=!m.transparent;mesh.receiveShadow=true;
  groups[g].add(mesh);return mesh;
}
function beam(g,x1,x2,ya,ha,yb,hb,th,m){
  const dy=yb-ya,dh=hb-ha,L=Math.hypot(dy,dh);
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(x2-x1,th,L),m);
  mesh.position.set((x1+x2)/2-6,(ha+hb)/2,12.5-(ya+yb)/2);
  mesh.rotation.x=Math.atan2(dh,dy);mesh.castShadow=!m.transparent;mesh.receiveShadow=true;groups[g].add(mesh);
}

// ---------- geometria (gerada de modelo/casa.json por scripts/model.py) ----------
CASA.caixas.forEach(c=>box(c[0],c[1],c[2],c[3],c[4],c[5],c[6],mat[c[7]]));
CASA.vigas.forEach(v=>beam(v[0],v[1],v[2],v[3],v[4],v[5],v[6],v[7],mat[v[8]]));
(function(){
  const pos=[];CASA.telhado.forEach(t=>t.forEach(v=>pos.push(v[0]-6,v[2],12.5-v[1])));
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();
  const m=mat.roof.clone();m.side=THREE.DoubleSide;
  const mesh=new THREE.Mesh(g,m);mesh.castShadow=true;mesh.receiveShadow=true;groups.roof.add(mesh);
})();

// ---------- labels ----------
const labelsEl=document.getElementById('labels');
const L=CASA.rotulos;
const lbls=L.map(l=>{const d=document.createElement('div');d.className='lbl';d.textContent=l[0];labelsEl.appendChild(d);return {el:d,v:new THREE.Vector3(l[1]-6,l[3],12.5-l[2]),name:l[0]};});

// ---------- sun ----------
const LAT=CASA.lote.latitude*Math.PI/180, LOT_AZ=CASA.lote.azimute_eixo;
function dirFromAz(az){const a=(az-LOT_AZ)*Math.PI/180;return new THREE.Vector3(Math.sin(a),0,-Math.cos(a));}
const seasonEl=document.getElementById('season'),hourEl=document.getElementById('hour');
const hourOut=document.getElementById('hourOut'),sunOut=document.getElementById('sunOut');
const compassNames=['norte','nordeste','leste','sudeste','sul','sudoeste','oeste','noroeste'];
function updateSun(){
  const dec=parseFloat(seasonEl.value)*Math.PI/180,h=parseFloat(hourEl.value);
  const H=(h-12)*15*Math.PI/180;
  const sinAlt=Math.sin(LAT)*Math.sin(dec)+Math.cos(LAT)*Math.cos(dec)*Math.cos(H);
  const alt=Math.asin(sinAlt);
  let az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(LAT)-Math.tan(dec)*Math.cos(LAT))*180/Math.PI+180;
  az=((az%360)+360)%360;
  const d=dirFromAz(az).multiplyScalar(Math.cos(alt));d.y=Math.sin(alt);
  sun.position.copy(d.clone().multiplyScalar(70));sun.target.position.set(0,0,0);
  const up=Math.max(0,Math.sin(alt));
  sun.intensity=alt>0?0.35+0.85*up:0;hemi.intensity=alt>0?0.45+0.2*up:0.35;
  const hh=Math.floor(h),mm=Math.round((h-hh)*60);
  hourOut.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  if(alt<=0){sunOut.textContent='O sol está abaixo do horizonte neste horário.';}
  else{const nm=compassNames[Math.round(az/45)%8];sunOut.textContent='Sol a '+Math.round(alt*180/Math.PI)+'° de altura, vindo do '+nm+'.';}
}
seasonEl.addEventListener('change',updateSun);hourEl.addEventListener('input',updateSun);updateSun();

// ---------- views ----------
const views={
  persp:{p:[-21,17,25],t:[0,2.5,-1]},
  top:{p:[0.01,46,0.6],t:[0,2,0]},
  street:{p:[2,3.2,24],t:[0,3.2,0]},
  yard:{p:[9,9,-24],t:[0,3.5,0]}
};
let anim=null;
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function goView(k){
  const v=views[k];
  document.querySelectorAll('button.v').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===k?'true':'false'));
  if(k==='top'){roofEl.checked=false;applyToggles();}
  const p1=new THREE.Vector3(...v.p),t1=new THREE.Vector3(...v.t);
  if(reduce){camera.position.copy(p1);controls.target.copy(t1);controls.update();return;}
  anim={p0:camera.position.clone(),t0:controls.target.clone(),p1,t1,s:performance.now(),d:900};
}
document.querySelectorAll('button.v').forEach(b=>b.addEventListener('click',()=>goView(b.dataset.view)));

// toggles
const roofEl=document.getElementById('cRoof'),furnEl=document.getElementById('cFurn'),wallsEl=document.getElementById('cWalls'),lblEl=document.getElementById('cLabels');
function applyToggles(){
  groups.roof.visible=roofEl.checked;groups.furn.visible=furnEl.checked;groups.muros.visible=wallsEl.checked;
}
[roofEl,furnEl,wallsEl,lblEl].forEach(e=>e.addEventListener('change',applyToggles));applyToggles();

// panel toggle (mobile)
const panel=document.getElementById('panel'),tg=document.getElementById('toggle');
tg.addEventListener('click',()=>{const c=panel.classList.toggle('closed');tg.textContent=c?'Mostrar':'Ocultar';tg.setAttribute('aria-expanded',c?'false':'true');});

// resize
function resize(){const w=container.clientWidth,h=container.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
camera.position.set(...views.persp.p);controls.target.set(...views.persp.t);controls.update();

// compass
const needle=document.getElementById('needleRot');
const N=dirFromAz(0);
const tmpA=new THREE.Vector3(),tmpB=new THREE.Vector3(),tmpV=new THREE.Vector3();

function loop(t){
  requestAnimationFrame(loop);
  if(anim){
    let k=Math.min(1,(t-anim.s)/anim.d);k=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(anim.p0,anim.p1,k);controls.target.lerpVectors(anim.t0,anim.t1,k);
    if(k>=1)anim=null;
  }
  controls.update();
  renderer.render(scene,camera);
  // labels: shown when roof hidden (except garage/escada/quintal which are outside the roof)
  const w=container.clientWidth,h=container.clientHeight;
  const showAll=lblEl.checked;
  lbls.forEach(l=>{
    const outside=(l.name==='Garagem'||l.name==='Escada'||l.name==='Quintal');
    if(!showAll||(!outside&&roofEl.checked)){l.el.style.display='none';return;}
    tmpV.copy(l.v).project(camera);
    if(tmpV.z>1||tmpV.z<-1){l.el.style.display='none';return;}
    l.el.style.display='block';
    l.el.style.left=((tmpV.x+1)/2*w)+'px';l.el.style.top=((1-tmpV.y)/2*h)+'px';
  });
  // compass rotation
  tmpA.set(0,0,0).project(camera);tmpB.copy(N).multiplyScalar(5).project(camera);
  const ang=Math.atan2((tmpB.x-tmpA.x)*w,(tmpB.y-tmpA.y)*h)*180/Math.PI;
  needle.setAttribute('transform','rotate('+ang.toFixed(1)+' 32 32)');
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
